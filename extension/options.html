<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cobwebs defaults</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="options.js"></script>
  </head>
  <body class="page">
    <header>
      <img src="icons/48.png" alt="" />
      <h1>Cobwebs defaults</h1>
    </header>
    <section>
      <h2>Every site</h2>
      <p class="status">
        Used by every site unless you change that site in the popup.
      </p>
      <div id="settings"></div>
    </section>
    <section>
      <h2>Sites</h2>
      <p class="status" id="sites"></p>
      <ul class="site-list" id="off-list"></ul>
      <button class="primary" id="forget">Forget all visit history</button>
    </section>
  </body>
</html>
